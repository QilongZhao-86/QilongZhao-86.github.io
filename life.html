<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="赵琦隆的摄影作品与旅行日记。" />
  <title>Photography & Travel | Qilong Zhao</title>

  <style>
    :root {
      --ink: #172126;
      --muted: #66757c;
      --primary: #155e75;
      --primary-dark: #0f3f50;
      --accent: #c9973e;
      --border: #dce6e8;
      --paper: #fbfcfc;
      --card: rgba(255, 255, 255, 0.9);
      --shadow: 0 18px 45px rgba(15, 63, 80, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(21, 94, 117, 0.12), transparent 28rem),
        radial-gradient(circle at 92% 18%, rgba(201, 151, 62, 0.1), transparent 25rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(251, 252, 252, 0.9);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 40px));
      min-height: 62px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: var(--primary-dark);
      font-weight: 800;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      font-weight: 650;
    }

    .back-link {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 90px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 40px;
      padding: 44px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .hero-copy {
      max-width: 680px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .hero-mark {
      color: var(--primary);
      font-size: 72px;
      line-height: 1;
      opacity: 0.16;
    }

    .content-section {
      margin-top: 56px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: var(--primary-dark);
      font-size: 28px;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .photo-grid {
      columns: 3;
      column-gap: 18px;
    }

    .photo-card {
      width: 100%;
      margin: 0 0 18px;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      break-inside: avoid;
      cursor: zoom-in;
      font: inherit;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .journal-card h3 {
      margin: 0;
      color: var(--ink);
      font-size: 17px;
    }

    .journal-card p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .album-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
      padding: 18px 20px;
      border-left: 3px solid var(--accent);
      background: rgba(255, 255, 255, 0.58);
    }

    .album-intro h3,
    .album-intro p {
      margin: 0;
    }

    .album-intro p {
      color: var(--muted);
      font-size: 14px;
    }

    .photo-album + .photo-album {
      margin-top: 54px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(7, 16, 20, 0.92);
    }

    .lightbox.is-open {
      display: grid;
    }

    .lightbox img {
      max-width: min(96vw, 1600px);
      max-height: 88vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 22px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 34px;
      line-height: 1;
    }

    .journal-list {
      display: grid;
      gap: 14px;
    }

    .journal-card {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 24px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
    }

    .journal-date {
      color: var(--primary);
      font-size: 14px;
      font-weight: 750;
    }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 190px;
      display: grid;
      place-items: center;
      padding: 32px;
      border: 1px dashed #b9cdd1;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--primary-dark);
      font-size: 17px;
    }

    footer {
      padding: 28px 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .page {
        padding-top: 36px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 30px 24px;
      }

      .hero-mark {
        display: none;
      }

      .photo-grid {
        columns: 1;
      }

      .journal-card {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .section-head {
        align-items: start;
        flex-direction: column;
        gap: 5px;
      }

      .album-intro {
        align-items: start;
        flex-direction: column;
        gap: 4px;
      }

      .top-links a:not(.back-link) {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Qilong Zhao</a>
      <nav class="top-links" aria-label="页面导航">
        <a href="#photography">摄影作品</a>
        <a href="#journeys">旅行日记</a>
        <a class="back-link" href="index.html">返回学术主页</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">Beyond Research</p>
        <h1>Photography<br />&amp; Travel</h1>
        <p class="hero-copy">记录光影、旅途，以及在路上的所见所想。这里将陆续收录摄影作品、城市漫步和旅行日记。</p>
      </div>
      <div class="hero-mark" aria-hidden="true">◉</div>
    </section>

    <section class="content-section" id="photography">
      <div class="section-head">
        <h2>摄影作品</h2>
        <p class="section-note">Photography · 82 photos</p>
      </div>
      <div id="photo-albums"></div>
    </section>

    <section class="content-section" id="journeys">
      <div class="section-head">
        <h2>旅行日记</h2>
        <p class="section-note">Travel Journals</p>
      </div>
      <div class="journal-list" id="journal-list"></div>
    </section>
  </main>

  <footer>© 2026 Qilong Zhao · Photography &amp; Travel</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片预览">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">×</button>
    <img id="lightbox-image" src="" alt="" />
  </div>

  <script>
    const albumData = [
      {
        title: "粤港澳",
        description: "城市、海岸与旅途片段",
        folder: "greater-bay-area",
        count: 40,
      },
      {
        title: "日出",
        description: "晨光抵达之前与之后",
        folder: "sunrise",
        count: 17,
      },
      {
        title: "城市漫游",
        description: "街道、建筑与异地风景",
        folder: "collection",
        count: 25,
      },
    ];

    // 后续可在这里添加旅行日记：{ title, date, summary, href }
    const journeys = [];

    const photoAlbums = document.getElementById("photo-albums");
    const journalList = document.getElementById("journal-list");

    photoAlbums.innerHTML = albumData.map(album => {
      const photos = Array.from({ length: album.count }, (_, index) => {
        const number = String(index + 1).padStart(2, "0");
        const image = `assets/photos/${album.folder}/${number}.webp`;
        const alt = `${album.title}摄影作品 ${number}`;
        return `
          <button class="photo-card" type="button" data-image="${image}" data-alt="${alt}">
            <img src="${image}" alt="${alt}" loading="lazy" />
          </button>
        `;
      }).join("");

      return `
        <section class="photo-album" aria-label="${album.title}">
          <div class="album-intro">
            <h3>${album.title}</h3>
            <p>${album.description} · ${album.count} 张</p>
          </div>
          <div class="photo-grid">${photos}</div>
        </section>
      `;
    }).join("");

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const closeLightbox = () => {
      lightbox.classList.remove("is-open");
      lightboxImage.src = "";
      document.body.style.overflow = "";
    };

    photoAlbums.addEventListener("click", event => {
      const card = event.target.closest(".photo-card");
      if (!card) return;
      lightboxImage.src = card.dataset.image;
      lightboxImage.alt = card.dataset.alt;
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    });

    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeLightbox();
    });

    if (journeys.length === 0) {
      journalList.innerHTML = '<div class="empty-state"><div><strong>旅途待续</strong>旅行日记将在这里陆续更新。</div></div>';
    } else {
      journalList.innerHTML = journeys.map(journey => `
        <a class="journal-card" href="${journey.href}">
          <div class="journal-date">${journey.date}</div>
          <div>
            <h3>${journey.title}</h3>
            <p>${journey.summary}</p>
          </div>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
