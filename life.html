<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="赵琦隆的摄影作品与旅行日记。" />
  <title>Photography & Travel | Qilong Zhao</title>

  <style>
    :root {
      --ink: #172126;
      --muted: #66757c;
      --primary: #155e75;
      --primary-dark: #0f3f50;
      --accent: #c9973e;
      --border: #dce6e8;
      --paper: #fbfcfc;
      --card: rgba(255, 255, 255, 0.9);
      --shadow: 0 18px 45px rgba(15, 63, 80, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(21, 94, 117, 0.12), transparent 28rem),
        radial-gradient(circle at 92% 18%, rgba(201, 151, 62, 0.1), transparent 25rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(251, 252, 252, 0.9);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 40px));
      min-height: 62px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: var(--primary-dark);
      font-weight: 800;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      font-weight: 650;
    }

    .back-link {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 90px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 40px;
      padding: 44px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .hero-copy {
      max-width: 680px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .hero-mark {
      color: var(--primary);
      font-size: 72px;
      line-height: 1;
      opacity: 0.16;
    }

    .content-section {
      margin-top: 56px;
    }

    .music-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 24px;
      margin-top: 28px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(12, 50, 64, 0.98), rgba(21, 94, 117, 0.92));
      box-shadow: 0 18px 42px rgba(15, 63, 80, 0.18);
      color: #fff;
    }

    .music-art {
      width: 112px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #0f2730 0 8%, #d2a44e 8.5% 11%, transparent 11.5%),
        repeating-radial-gradient(circle at center, rgba(255,255,255,0.1) 0 1px, transparent 2px 7px),
        linear-gradient(145deg, #1a6d83, #081c25);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      color: rgba(255,255,255,0.9);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .music-card.is-playing .music-art {
      animation: record-spin 9s linear infinite;
    }

    @keyframes record-spin {
      to { transform: rotate(360deg); }
    }

    .music-kicker {
      margin: 0 0 4px;
      color: #e5bd6d;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .music-card h2 {
      color: #fff;
      font-size: 22px;
    }

    .music-artist {
      margin: 5px 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 14px;
    }

    .player-controls {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 126px;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
    }

    .play-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: var(--primary-dark);
      cursor: pointer;
      font-size: 17px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.18s ease;
    }

    .play-button:hover { transform: scale(1.05); }

    .timeline { min-width: 0; }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.74);
      font-size: 15px;
    }

    .player-range {
      width: 100%;
      height: 4px;
      display: block;
      margin: 0;
      accent-color: #e5bd6d;
      cursor: pointer;
    }

    .music-card audio {
      display: none;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: var(--primary-dark);
      font-size: 28px;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .photo-grid {
      columns: 3;
      column-gap: 18px;
    }

    .photo-card {
      width: 100%;
      margin: 0 0 18px;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      break-inside: avoid;
      cursor: zoom-in;
      font: inherit;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .journal-card h3 {
      margin: 0;
      color: var(--ink);
      font-size: 17px;
    }

    .journal-card p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .album-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
      padding: 18px 20px;
      border-left: 3px solid var(--accent);
      background: rgba(255, 255, 255, 0.58);
    }

    .album-intro h3,
    .album-intro p {
      margin: 0;
    }

    .album-intro p {
      color: var(--muted);
      font-size: 14px;
    }

    .photo-album + .photo-album {
      margin-top: 54px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(7, 16, 20, 0.92);
    }

    .lightbox.is-open {
      display: grid;
    }

    .lightbox img {
      max-width: min(96vw, 1600px);
      max-height: 88vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 22px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 34px;
      line-height: 1;
    }

    .journal-list {
      display: grid;
      gap: 14px;
    }

    .journal-card {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 24px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
    }

    .journal-date {
      color: var(--primary);
      font-size: 14px;
      font-weight: 750;
    }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 190px;
      display: grid;
      place-items: center;
      padding: 32px;
      border: 1px dashed #b9cdd1;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--primary-dark);
      font-size: 17px;
    }

    footer {
      padding: 28px 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .page {
        padding-top: 36px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 30px 24px;
      }

      .music-card {
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 16px;
        padding: 20px;
      }

      .music-art { width: 78px; }

      .player-controls {
        grid-column: 1 / -1;
        grid-template-columns: 46px minmax(0, 1fr);
        margin-top: 14px;
      }

      .volume-control { display: none; }

      .hero-mark {
        display: none;
      }

      .photo-grid {
        columns: 1;
      }

      .journal-card {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .section-head {
        align-items: start;
        flex-direction: column;
        gap: 5px;
      }

      .album-intro {
        align-items: start;
        flex-direction: column;
        gap: 4px;
      }

      .top-links a:not(.back-link) {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Qilong Zhao</a>
      <nav class="top-links" aria-label="页面导航">
        <a href="#photography">摄影作品</a>
        <a href="#journeys">旅行日记</a>
        <a class="back-link" href="index.html">返回学术主页</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">Beyond Research</p>
        <h1>Photography<br />&amp; Travel</h1>
        <p class="hero-copy">记录光影、旅途，以及在路上的所见所想。这里将陆续收录摄影作品、城市漫步和旅行日记。</p>
      </div>
      <div class="hero-mark" aria-hidden="true">◉</div>
    </section>

    <section class="music-card" aria-labelledby="music-title">
      <div class="music-art" aria-hidden="true">HK</div>
      <div class="music-main">
        <p class="music-kicker">Now Playing</p>
        <h2 id="music-title">Hong Kong</h2>
        <p class="music-artist">The Weeknd · feat. 王菲季候風</p>
        <div class="player-controls">
          <button class="play-button" id="play-button" type="button" aria-label="播放">▶</button>
          <div class="timeline">
            <input class="player-range" id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度" />
            <div class="time-row"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
          </div>
          <label class="volume-control" aria-label="音量">
            <span aria-hidden="true">◕</span>
            <input class="player-range" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
          </label>
        </div>
      </div>
      <audio id="music-audio" preload="metadata" aria-label="播放 The Weeknd 的 Hong Kong">
        <source src="assets/audio/hong-kong.mp3" type="audio/mpeg" />
        你的浏览器不支持音频播放。
      </audio>
    </section>

    <section class="content-section" id="photography">
      <div class="section-head">
        <h2>摄影作品</h2>
        <p class="section-note">Photography · 82 photos</p>
      </div>
      <div id="photo-albums"></div>
    </section>

    <section class="content-section" id="journeys">
      <div class="section-head">
        <h2>旅行日记</h2>
        <p class="section-note">Travel Journals</p>
      </div>
      <div class="journal-list" id="journal-list"></div>
    </section>
  </main>

  <footer>© 2026 Qilong Zhao · Photography &amp; Travel</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片预览">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">×</button>
    <img id="lightbox-image" src="" alt="" />
  </div>

  <script>
    const albumData = [
      {
        title: "粤港澳",
        description: "城市、海岸与旅途片段",
        folder: "greater-bay-area",
        count: 40,
      },
      {
        title: "日出",
        description: "晨光抵达之前与之后",
        folder: "sunrise",
        count: 17,
      },
      {
        title: "城市漫游",
        description: "街道、建筑与异地风景",
        folder: "collection",
        count: 25,
      },
    ];

    // 后续可在这里添加旅行日记：{ title, date, summary, href }
    const journeys = [];

    const photoAlbums = document.getElementById("photo-albums");
    const journalList = document.getElementById("journal-list");
    const musicCard = document.querySelector(".music-card");
    const audio = document.getElementById("music-audio");
    const playButton = document.getElementById("play-button");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentTime = document.getElementById("current-time");
    const duration = document.getElementById("duration");

    const formatTime = seconds => {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remaining = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remaining}`;
    };

    audio.volume = Number(volume.value);
    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });
    audio.addEventListener("timeupdate", () => {
      progress.value = audio.duration ? Math.round((audio.currentTime / audio.duration) * 1000) : 0;
      currentTime.textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener("play", () => {
      playButton.textContent = "❚❚";
      playButton.setAttribute("aria-label", "暂停");
      musicCard.classList.add("is-playing");
    });
    audio.addEventListener("pause", () => {
      playButton.textContent = "▶";
      playButton.setAttribute("aria-label", "播放");
      musicCard.classList.remove("is-playing");
    });
    playButton.addEventListener("click", () => {
      if (audio.paused) audio.play(); else audio.pause();
    });
    progress.addEventListener("input", () => {
      if (audio.duration) audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
    });
    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value);
    });

    photoAlbums.innerHTML = albumData.map(album => {
      const photos = Array.from({ length: album.count }, (_, index) => {
        const number = String(index + 1).padStart(2, "0");
        const image = `assets/photos/${album.folder}/${number}.webp`;
        const alt = `${album.title}摄影作品 ${number}`;
        return `
          <button class="photo-card" type="button" data-image="${image}" data-alt="${alt}">
            <img src="${image}" alt="${alt}" loading="lazy" />
          </button>
        `;
      }).join("");

      return `
        <section class="photo-album" aria-label="${album.title}">
          <div class="album-intro">
            <h3>${album.title}</h3>
            <p>${album.description} · ${album.count} 张</p>
          </div>
          <div class="photo-grid">${photos}</div>
        </section>
      `;
    }).join("");

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const closeLightbox = () => {
      lightbox.classList.remove("is-open");
      lightboxImage.src = "";
      document.body.style.overflow = "";
    };

    photoAlbums.addEventListener("click", event => {
      const card = event.target.closest(".photo-card");
      if (!card) return;
      lightboxImage.src = card.dataset.image;
      lightboxImage.alt = card.dataset.alt;
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    });

    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeLightbox();
    });

    if (journeys.length === 0) {
      journalList.innerHTML = '<div class="empty-state"><div><strong>旅途待续</strong>旅行日记将在这里陆续更新。</div></div>';
    } else {
      journalList.innerHTML = journeys.map(journey => `
        <a class="journal-card" href="${journey.href}">
          <div class="journal-date">${journey.date}</div>
          <div>
            <h3>${journey.title}</h3>
            <p>${journey.summary}</p>
          </div>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
